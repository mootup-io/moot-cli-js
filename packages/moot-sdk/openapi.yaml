  /auth/set-password:
    post:
      summary: Auth Set Password
      description: "Set or change the password for the authenticated user (Run AE-3).\n\
        \nIf the user already has a password_hash, ``current_password`` is\nrequired\
        \ and must verify. If not, ``current_password`` is ignored\n(first-time set\
        \ path).\n\nBH-2-A: validate_password_strength(req.new_password) before hash.\n\
        BH-2-D: if session-authed AND session age > 5min AND existing_hash present,\n\
        \        require non-empty current_password; else 403 step_up_required.\n\
